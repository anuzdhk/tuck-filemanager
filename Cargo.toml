[workspace]
resolver = "3"
members = ["crates/tuck-core", "crates/tuck"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["anuzdhk"]
repository = "https://github.com/anuzdhk/kivo-filemanager"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4

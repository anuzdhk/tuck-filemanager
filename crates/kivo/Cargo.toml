[package]
name = "kivo"
description = "Kivo file manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kivo-core = { path = "../kivo-core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
async-channel = "2.5.0"
libc = "0.2.191"
sourceview5 = "0.11.2"
poppler-rs = "0.26.0"
image = { version = "0.25.10", default-features = false, features = ["gif"] }
